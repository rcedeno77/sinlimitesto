<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin Límites TO | Terapia Ocupacional por Lic. Claudia Ortega</title>
    
    <link rel="icon" href="logotipo.png" type="image/png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           VARIABLES DE COLOR (HIGH-TICKET)
           ========================================= */
        :root {
            --brand-teal: #1A7585;      
            --brand-teal-dark: #125460; 
            --brand-blue: #2A79C2;      
            --brand-green: #9CCB53;     
            --bg-light: #F4F7F7;     
            --bg-white: #FFFFFF;        
            --text-dark: #2D3748;       
            --text-medium: #4A5568; 
            --footer-bg: #1A202C; 
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth; 
        }

        body {
            background-color: var(--bg-white);
            color: var(--text-dark);
            font-family: 'Nunito', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, h4 {
            font-family: 'Quicksand', sans-serif;
            color: var(--brand-teal);
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        /* =========================================
           ANIMACIONES DE ENTRADA 
           ========================================= */
        .fade-in {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* =========================================
           HEADER (LOGOTIPO GRANDE Y PROPORCIONADO)
           ========================================= */
        header {
            padding: 10px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 100;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(8px);
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
            height: 115px; 
        }

        .logo-container {
            display: flex;
            align-items: center;
            height: 100%;
            text-decoration: none;
        }

        .logo-image {
            height: 95px; /* Logotipo imponente, claro y con gran presencia visual */
            width: auto;
            object-fit: contain;
            mix-blend-mode: multiply; 
        }

        .header-btn {
            text-decoration: none;
            color: var(--brand-teal);
            font-size: 0.95rem;
            font-weight: 700;
            padding: 12px 28px;
            border-radius: 30px;
            border: 2px solid var(--brand-teal);
            background-color: transparent;
            transition: var(--transition);
            font-family: 'Quicksand', sans-serif; 
        }

        .header-btn:hover {
            background-color: var(--brand-teal);
            color: #FFF;
        }

        /* =========================================
           SECCIÓN 1: HERO 
           ========================================= */
        .hero {
            min-height: 95vh;
            display: flex;
            align-items: center;
            padding: 150px 5% 100px 5%; 
            background-color: var(--bg-white); 
            position: relative; 
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40px;
            background: linear-gradient(to bottom, transparent, var(--brand-teal));
            opacity: 0.1;
        }

        .hero-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1300px;
            margin: 0 auto;
            gap: 50px;
            width: 100%;
        }

        .hero-content {
            flex: 1;
            max-width: 600px;
        }

        .hero-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--brand-blue);
            margin-bottom: 20px;
            display: inline-block;
            font-weight: 700;
            background-color: rgba(42, 121, 194, 0.08);
            padding: 6px 16px;
            border-radius: 20px;
            font-family: 'Quicksand', sans-serif;
        }

        .hero h1 {
            font-size: 3.4rem;
            line-height: 1.2; 
            margin-bottom: 20px;
            color: var(--text-dark);
        }

        .hero h1 span {
            color: var(--brand-teal);
            font-weight: 700;
        }

        .hero p {
            font-size: 1.15rem;
            color: var(--text-medium);
            margin-bottom: 35px;
            font-weight: 400;
            line-height: 1.7;
        }

        .btn-primary {
            display: inline-block;
            background-color: var(--brand-teal);
            color: #FFF;
            padding: 18px 42px; 
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 700;
            border-radius: 30px;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(26, 117, 133, 0.25);
            font-family: 'Quicksand', sans-serif;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(26, 117, 133, 0.35);
            background-color: var(--brand-teal-dark);
        }

        .hero-image-wrapper {
            flex: 1;
            display: flex;
            justify-content: flex-end;
            position: relative;
            z-index: 2;
        }

        .hero-image-wrapper img {
            width: 100%;
            max-width: 600px;
            height: auto;
            border-radius: 30px 30px 30px 100px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            object-fit: cover;
            position: relative;
        }

        /* =========================================
           SECCIÓN 2: EMPATÍA 
           ========================================= */
        .empathy {
            padding: 100px 5% 80px 5%; 
            text-align: center;
            background-color: var(--brand-teal);
            position: relative;
            border-top-left-radius: 60px; 
            border-top-right-radius: 60px;
            margin-top: -60px; 
            z-index: 10; 
        }

        .empathy h2 {
            font-size: 2.4rem;
            max-width: 850px;
            margin: 0 auto 25px auto;
            color: #FFF;
            line-height: 1.35;
        }

        .empathy p {
            font-size: 1.15rem;
            max-width: 650px;
            margin: 0 auto;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 300;
            line-height: 1.8;
        }

        /* =========================================
           SECCIÓN 3: SERVICIOS 
           ========================================= */
        .services {
            padding: 100px 5% 80px 5%; 
            background-color: var(--bg-light); 
        }

        .section-title {
            font-size: 2.6rem;
            text-align: center;
            margin-bottom: 50px;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px; 
            max-width: 1200px;
            margin: 0 auto;
        }

        .service-card {
            background-color: var(--bg-white); 
            padding: 40px 30px; 
            border-radius: 20px; 
            border-top: 5px solid var(--brand-green); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            transition: all 0.4s ease;
            display: flex;
            flex-direction: column;
        }

        .service-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(26, 117, 133, 0.08); 
            border-top-color: var(--brand-teal); 
        }

        .service-card h3 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: var(--text-dark);
            line-height: 1.3;
        }

        .service-card p {
            color: var(--text-medium);
            font-size: 1rem;
            font-weight: 400;
            line-height: 1.7;
        }

        /* =========================================
           SECCIÓN 4: SOBRE MÍ 
           ========================================= */
        .about {
            padding: 80px 5%;
            background-color: var(--bg-white);
        }

        .about-container {
            display: flex;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            gap: 50px;
        }

        .about-text { 
            flex: 1.2; 
        }
        .about-text h2 { font-size: 2.6rem; margin-bottom: 25px; }
        .about-text p { margin-bottom: 20px; color: var(--text-medium); font-size: 1.05rem; font-weight: 400; line-height: 1.8; }
        .about-text strong { color: var(--brand-teal); font-weight: 700; }

        .about-image {
            flex: 0.8;
            max-width: 420px; 
            height: 550px; 
            border-radius: 100px 20px 20px 20px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.12);
            margin: 0 auto; 
        }
        .about-image img { 
            width: 100%; 
            height: 100%; 
            display: block; 
            object-fit: cover; 
            object-position: top center; 
        }

        /* =========================================
           SECCIÓN 5: TESTIMONIOS 
           ========================================= */
        .testimonials {
            padding: 90px 5%;
            text-align: center;
            background-color: var(--bg-light); 
            position: relative;
            overflow: hidden;
            border-top: 1px solid rgba(0,0,0,0.03);
            border-bottom: 1px solid rgba(0,0,0,0.03);
        }
        
        .testimonials::before {
            content: '\201C';
            font-family: 'Quicksand', serif;
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 280px;
            color: var(--brand-green);
            opacity: 0.1;
            z-index: 0;
            line-height: 1;
        }

        .testimonial-block { 
            max-width: 850px; 
            margin: 0 auto; 
            position: relative;
            z-index: 1;
        }
        .testimonial-block p.quote { 
            font-size: 1.7rem; 
            font-style: italic; 
            margin-bottom: 25px; 
            line-height: 1.5; 
            color: var(--brand-teal-dark);
            font-family: 'Nunito', sans-serif; 
        }
        .testimonial-block p.author { 
            font-size: 0.95rem; 
            font-weight: 700; 
            color: var(--text-dark);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* =========================================
           SECCIÓN 6: EL PROCESO 
           ========================================= */
        .process { 
            padding: 80px 5%; 
            background-color: var(--bg-white); 
        }
        
        .process-container {
            max-width: 1200px; 
            margin: 0 auto; 
        }
        
        .process-steps { 
            display: flex; 
            justify-content: space-between; 
            gap: 30px; 
            margin-top: 50px; 
        }
        
        .step { 
            flex: 1; 
            padding: 35px 25px; 
            background-color: var(--bg-light); 
            border-radius: 20px; 
            text-align: center;
            transition: var(--transition);
            border-top: 4px solid transparent;
        }

        .step:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.05);
            border-top-color: var(--brand-blue);
            background-color: var(--bg-white);
        }

        .step-number { 
            font-family: 'Quicksand', sans-serif; 
            font-weight: 700; 
            font-style: italic; 
            font-size: 3.2rem; 
            color: var(--brand-green); 
            margin-bottom: 5px; 
            display: block; 
            opacity: 0.9; 
        }
        .step h3 { margin-bottom: 15px; font-size: 1.3rem; color: var(--brand-teal); }
        .step p { color: var(--text-medium); font-weight: 400; line-height: 1.6; }

        /* =========================================
           SECCIÓN 7: LLAMADO A LA ACCIÓN FINAL
           ========================================= */
        .final-cta {
            padding: 90px 5%;
            text-align: center;
            background-color: var(--brand-teal); 
            color: #FFF;
        }
        
        .final-cta h2 {
            color: #FFF;
            font-size: 2.4rem;
            margin-bottom: 15px;
        }
        
        .final-cta p {
            font-size: 1.15rem;
            margin-bottom: 35px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.9);
        }

        .btn-secondary {
            display: inline-block;
            background-color: #FFF; 
            color: var(--brand-teal);
            padding: 18px 45px; 
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 30px;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            font-family: 'Quicksand', sans-serif;
        }

        .btn-secondary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            background-color: var(--bg-light);
            color: var(--brand-teal-dark);
        }

        /* =========================================
           FOOTER 
           ========================================= */
        footer {
            background-color: var(--footer-bg); 
            color: #A0AEC0; 
            padding: 60px 5% 30px 5%;
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 30px;
            margin-bottom: 30px;
            max-width: 1200px;
            margin: 0 auto 30px auto;
        }

        .footer-logo-img {
            height: 75px; 
            max-width: 280px;
            width: auto;
            object-fit: contain;
            filter: brightness(0) invert(1);
            opacity: 0.9;
            transition: var(--transition);
        }
        
        .footer-logo-img:hover {
            opacity: 1;
            transform: scale(1.02);
        }

        .footer-links a {
            color: #A0AEC0;
            text-decoration: none;
            margin-left: 30px;
            font-size: 0.95rem;
            transition: var(--transition);
            font-weight: 600;
            font-family: 'Quicksand', sans-serif; 
        }
        .footer-links a:hover { color: var(--brand-green); }

        .footer-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .footer-bottom p {
            font-size: 0.85rem;
            font-weight: 300;
        }

        .footer-social-icons {
            display: flex;
            gap: 15px;
        }

        .footer-social-icons a {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: rgba(255,255,255,0.05);
            transition: var(--transition);
        }

        .footer-social-icons svg {
            width: 20px;
            height: 20px;
            fill: #A0AEC0;
            transition: var(--transition);
        }

        .footer-social-icons a:hover {
            background-color: var(--brand-green);
        }
        .footer-social-icons a:hover svg {
            fill: #FFF;
        }

        /* =========================================
           BOTÓN FLOTANTE SOLO WHATSAPP
           ========================================= */
        .floating-whatsapp {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background-color: #25D366;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: var(--transition);
            z-index: 1000;
            text-decoration: none;
        }

        .floating-whatsapp:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .floating-whatsapp svg {
            width: 35px;
            height: 35px;
            fill: white;
        }

        /* =========================================
           RESPONSIVE DESIGN (MÓVILES)
           ========================================= */
        @media (max-width: 992px) {
            header { height: 90px; }
            .logo-image { height: 70px; } 
            .hero { min-height: auto; padding-top: 130px; }
            .hero-container { flex-direction: column; text-align: center; }
            .hero h1 { font-size: 2.6rem; }
            .hero-image-wrapper { justify-content: center; margin-top: 20px; }
            .hero-image-wrapper img { border-radius: 20px; }
            .empathy { border-top-left-radius: 40px; border-top-right-radius: 40px; margin-top: -40px; }
            .about-container { flex-direction: column; text-align: center; }
            .process-steps { flex-direction: column; }
            .footer-content, .footer-bottom { flex-direction: column; gap: 20px; text-align: center; }
            .footer-links a { margin: 10px; display: inline-block; }
            .footer-logo-img { height: 55px; } 
            .floating-whatsapp { bottom: 20px; right: 20px; width: 55px; height: 55px; }
            .floating-whatsapp svg { width: 30px; height: 30px; }
        }
    </style>
</head>
<body>

    <header>
        <a href="#inicio" class="logo-container">
            <img src="logo1.png" alt="Sin Límites TO" class="logo-image">
        </a>
        <a href="
